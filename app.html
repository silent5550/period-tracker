<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 心情与生理期追踪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icon Components (inline SVG replacements for lucide-react) ---
        const CalendarIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>
            </svg>
        );
        const SettingsIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        );
        const ChevronLeft = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m15 18-6-6 6-6"/>
            </svg>
        );
        const ChevronRight = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m9 18 6-6-6-6"/>
            </svg>
        );
        const Sparkles = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
            </svg>
        );
        const XIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
            </svg>
        );
        const Check = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M20 6 9 17l-5-5"/>
            </svg>
        );
        const FileText = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>
            </svg>
        );

        // --- 常量定义 ---
        const PHASES = {
          MENSTRUAL: '月经期',
          FOLLICULAR: '卵泡期',
          OVULATION_PERIOD: '排卵期',
          OVULATION_DAY: '排卵日',
          LUTEAL: '黄体期',
        };

        const MOODS = {
          HAPPY: { label: '开心', emoji: '😊' },
          IRRITABLE: { label: '烦躁', emoji: '😫' },
          ANGRY: { label: '愤怒', emoji: '😡' },
          CALM: { label: '平静', emoji: '😐' },
        };

        const PHASE_STYLES = {
          [PHASES.MENSTRUAL]: { bg: 'bg-red-100', text: 'text-red-800', border: 'border-red-300' },
          [PHASES.FOLLICULAR]: { bg: 'bg-blue-50', text: 'text-blue-800', border: 'border-blue-200' },
          [PHASES.OVULATION_PERIOD]: { bg: 'bg-purple-100', text: 'text-purple-800', border: 'border-purple-300' },
          [PHASES.OVULATION_DAY]: { bg: 'bg-fuchsia-200', text: 'text-fuchsia-900', border: 'border-fuchsia-400' },
          [PHASES.LUTEAL]: { bg: 'bg-yellow-50', text: 'text-yellow-800', border: 'border-yellow-200' },
        };

        // --- 安全的日期工具函数 ---
        const parseDateStr = (dateStr) => {
          const [year, month, day] = dateStr.split('-');
          return new Date(parseInt(year, 10), parseInt(month, 10) - 1, parseInt(day, 10));
        };

        const formatDate = (date) => {
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const day = String(date.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        };

        const addDays = (dateStr, days) => {
          const date = parseDateStr(dateStr);
          date.setDate(date.getDate() + days);
          return formatDate(date);
        };

        const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
        const getFirstDayOfMonth = (year, month) => {
          const day = new Date(year, month, 1).getDay();
          return day === 0 ? 6 : day - 1;
        };

        // --- 主应用组件 ---
        function App() {
          const [currentDate, setCurrentDate] = useState(new Date());
          const [view, setView] = useState('calendar');

          const [settings, setSettings] = useState(() => {
            try {
              const saved = localStorage.getItem('period_tracker_settings');
              return saved ? JSON.parse(saved) : {
                cycleLength: 28,
                periodLength: 5,
                lutealLength: 14,
                lastPeriodStart: formatDate(new Date(new Date().setDate(new Date().getDate() - 10))),
              };
            } catch { return {
              cycleLength: 28,
              periodLength: 5,
              lutealLength: 14,
              lastPeriodStart: formatDate(new Date(new Date().setDate(new Date().getDate() - 10))),
            }; }
          });

          const [records, setRecords] = useState(() => {
            try {
              const saved = localStorage.getItem('period_tracker_records');
              return saved ? JSON.parse(saved) : {};
            } catch { return {}; }
          });

          const [predictedSnapshots, setPredictedSnapshots] = useState(() => {
            try {
              const saved = localStorage.getItem('period_tracker_snapshots');
              return saved ? JSON.parse(saved) : {};
            } catch { return {}; }
          });

          // useRef 缓存快照，避免渲染中 setState 导致循环
          const snapshotsRef = useRef(predictedSnapshots);
          const snapshotsDirtyRef = useRef(false);

          // 数据变更时自动保存到 localStorage
          useEffect(() => {
            localStorage.setItem('period_tracker_records', JSON.stringify(records));
          }, [records]);

          useEffect(() => {
            localStorage.setItem('period_tracker_settings', JSON.stringify(settings));
          }, [settings]);

          useEffect(() => {
            localStorage.setItem('period_tracker_snapshots', JSON.stringify(predictedSnapshots));
          }, [predictedSnapshots]);

          // 渲染完成后，如果有新快照产生，同步到 state
          useEffect(() => {
            if (snapshotsDirtyRef.current) {
              snapshotsDirtyRef.current = false;
              setPredictedSnapshots({ ...snapshotsRef.current });
            }
          });

          const [modalState, setModalState] = useState({ isOpen: false, dateStr: null });

          const getPhaseFromCycleDay = (dayOfCycle) => {
            const ovulationDay = settings.cycleLength - settings.lutealLength + 1;
            const ovulationStart = ovulationDay - 5;
            const ovulationEnd = ovulationDay + 4;

            if (dayOfCycle <= settings.periodLength) return PHASES.MENSTRUAL;
            if (dayOfCycle === ovulationDay) return PHASES.OVULATION_DAY;
            if (dayOfCycle >= ovulationStart && dayOfCycle <= ovulationEnd) return PHASES.OVULATION_PERIOD;
            if (dayOfCycle < ovulationStart) return PHASES.FOLLICULAR;
            return PHASES.LUTEAL;
          };

          const calculatePredictedPhase = (dateStr) => {
            let latestPeriodStart = settings.lastPeriodStart;

            const menstrualDates = Object.keys(records)
              .filter(date => records[date].actualPhase === PHASES.MENSTRUAL && date < dateStr)
              .sort((a, b) => parseDateStr(b).getTime() - parseDateStr(a).getTime());

            if (menstrualDates.length > 0) {
              latestPeriodStart = menstrualDates[0];
              for (let i = 0; i < 15; i++) {
                const prevDate = addDays(latestPeriodStart, -1);
                if (records[prevDate] && records[prevDate].actualPhase === PHASES.MENSTRUAL) {
                  latestPeriodStart = prevDate;
                } else {
                  break;
                }
              }
            }

            const targetDate = parseDateStr(dateStr);
            const startDate = parseDateStr(latestPeriodStart);
            const diffTime = targetDate.getTime() - startDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
              const mod = (-diffDays) % settings.cycleLength;
              let dayOfCycle = settings.cycleLength - mod;
              if (dayOfCycle === 0) dayOfCycle = settings.cycleLength;
              return getPhaseFromCycleDay(dayOfCycle);
            }

            const dayOfCycle = (diffDays % settings.cycleLength) + 1;
            return getPhaseFromCycleDay(dayOfCycle);
          };

          const predictMoodForPhase = (targetPhase) => {
            const moodCounts = {};
            let totalCount = 0;

            Object.entries(records).forEach(([dateStr, record]) => {
              if (record.actualMood) {
                const phaseForThisDate = record.actualPhase || calculatePredictedPhase(dateStr);
                if (phaseForThisDate === targetPhase) {
                  moodCounts[record.actualMood] = (moodCounts[record.actualMood] || 0) + 1;
                  totalCount++;
                }
              }
            });

            if (totalCount === 0) return '平静';

            let predictedMood = '平静';
            let maxCount = 0;
            Object.entries(moodCounts).forEach(([mood, count]) => {
              if (count > maxCount) {
                maxCount = count;
                predictedMood = mood;
              }
            });
            return predictedMood;
          };

          const getDayData = (dateStr) => {
            const actualData = records[dateStr] || {};
            const todayStr = formatDate(new Date());
            const isHistorical = dateStr <= todayStr;

            let predictedPhase;

            if (isHistorical) {
              // 历史/今天的日期：优先使用快照锁定的预测值
              const snapshot = snapshotsRef.current[dateStr];
              if (snapshot) {
                predictedPhase = snapshot.predictedPhase;
              } else {
                // 首次访问，计算并存入快照缓存
                predictedPhase = calculatePredictedPhase(dateStr);
                snapshotsRef.current[dateStr] = { predictedPhase };
                snapshotsDirtyRef.current = true;
              }
            } else {
              // 未来日期：每次重新计算，不锁定
              predictedPhase = calculatePredictedPhase(dateStr);
            }

            return {
              dateStr,
              actualPhase: actualData.actualPhase || null,
              actualMood: actualData.actualMood || null,
              note: actualData.note || '',
              predictedPhase,
              predictedMood: null,
              isFuture: !isHistorical,
            };
          };

          const clearSnapshots = () => {
            snapshotsRef.current = {};
            snapshotsDirtyRef.current = false;
            setPredictedSnapshots({});
            localStorage.removeItem('period_tracker_snapshots');
          };

          const handleSaveRecord = (dateStr, data) => {
            setRecords(prev => ({ ...prev, [dateStr]: data }));
            setModalState({ isOpen: false, dateStr: null });
          };

          const renderCalendarDays = () => {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            const firstDay = getFirstDayOfMonth(year, month);

            const days = [];
            for (let i = 0; i < firstDay; i++) {
              days.push(<div key={`empty-${i}`} className="p-2 opacity-0"></div>);
            }

            const todayStr = formatDate(new Date());

            for (let day = 1; day <= daysInMonth; day++) {
              const dateStr = formatDate(new Date(year, month, day));
              const dayData = getDayData(dateStr);
              const isToday = dateStr === todayStr;

              const isSplit = dayData.actualPhase && dayData.actualPhase !== dayData.predictedPhase;

              const displayPhase = dayData.actualPhase || dayData.predictedPhase;
              const isPredictedOnly = !dayData.actualPhase;

              const actualMoodEmoji = dayData.actualMood ? Object.values(MOODS).find(m => m.label === dayData.actualMood)?.emoji : null;
              const actualPhaseToUse = dayData.actualPhase || dayData.predictedPhase;

              const baseClasses = "relative flex flex-col overflow-hidden h-[85px] sm:h-[95px] border rounded-xl cursor-pointer transition-all hover:shadow-md";

              let containerClasses = '';
              if (isSplit) {
                containerClasses = `${baseClasses} border-gray-200 shadow-sm bg-white ${isToday ? 'ring-2 ring-pink-500 ring-offset-2' : ''}`;
              } else {
                const styles = PHASE_STYLES[displayPhase];
                containerClasses = `${baseClasses} ${styles.bg} ${styles.text} ${styles.border} ${isPredictedOnly ? 'opacity-90 border-dashed border-gray-300' : 'border-solid shadow-sm border-[1.5px]'} ${isToday ? 'ring-2 ring-pink-500 ring-offset-2' : ''}`;
              }
              // isPredictedOnly means no actualPhase set - uses dashed border, lower opacity
              // If actualPhase is set (even same as predicted) - solid border, full opacity

              days.push(
                <div key={dateStr} onClick={() => setModalState({ isOpen: true, dateStr })} className={containerClasses}>
                  <div className="absolute top-0 left-0 right-0 p-1 sm:p-1.5 flex justify-between items-start z-10 pointer-events-none">
                    <span
                      className={`text-xs sm:text-sm font-medium ${isToday ? 'text-pink-600 font-bold' : 'text-gray-800'}`}
                      style={{ textShadow: isSplit ? '0 0 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1)' : 'none' }}
                    >
                      {day}
                    </span>
                    {dayData.note && (
                      <div className="bg-white/80 rounded-full p-0.5 shadow-sm backdrop-blur-sm">
                        <FileText className="w-2.5 h-2.5 text-gray-500" />
                      </div>
                    )}
                  </div>

                  {isSplit ? (
                    <div className="flex-1 flex w-full h-full pt-[18px] sm:pt-[20px]">
                      <div className={`w-1/2 h-full flex flex-col items-center justify-end pb-1 sm:pb-1.5 border-r border-gray-100 relative ${PHASE_STYLES[dayData.predictedPhase].bg} ${PHASE_STYLES[dayData.predictedPhase].text} opacity-90`}>
                         <div className="absolute top-1 left-1/2 -translate-x-1/2 bg-white/70 text-[8px] px-1 rounded text-gray-500 font-medium shadow-sm">预</div>
                         <span className="text-[9px] sm:text-[10px] scale-90 whitespace-nowrap opacity-90">{dayData.predictedPhase}</span>
                      </div>
                      <div className={`w-1/2 h-full flex flex-col items-center justify-end pb-1 sm:pb-1.5 relative ${PHASE_STYLES[actualPhaseToUse].bg} ${PHASE_STYLES[actualPhaseToUse].text}`}>
                         <div className="absolute top-1 left-1/2 -translate-x-1/2 bg-white/90 text-[8px] px-1 rounded text-pink-600 font-bold shadow-sm">实</div>
                         {actualMoodEmoji && <span className="text-base sm:text-lg mb-0.5 drop-shadow-sm scale-110">{actualMoodEmoji}</span>}
                         <span className="text-[9px] sm:text-[10px] font-bold whitespace-nowrap">{actualPhaseToUse}</span>
                      </div>
                    </div>
                  ) : (
                    <>
                      <div className="flex-1 w-full flex items-center justify-center mt-3 sm:mt-4">
                        {actualMoodEmoji && <span className="text-base sm:text-xl drop-shadow-sm">{actualMoodEmoji}</span>}
                      </div>
                      <div className="w-full h-6 flex items-center justify-center pb-1">
                        <span className={`text-[10px] sm:text-xs whitespace-nowrap ${isPredictedOnly ? 'text-gray-600' : 'font-bold text-gray-800'}`}>
                          {displayPhase}
                        </span>
                      </div>
                    </>
                  )}
                </div>
              );
            }
            return days;
          };

          return (
            <div className="min-h-screen bg-pink-50 text-gray-800 font-sans pb-10 selection:bg-pink-200">
              <nav className="bg-white shadow-sm sticky top-0 z-10">
                <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                  <div className="flex items-center space-x-2 text-pink-600">
                    <Sparkles className="w-6 h-6" />
                    <h1 className="text-lg sm:text-xl font-bold tracking-tight">AI 心情与生理期</h1>
                  </div>
                  <div className="flex space-x-2">
                    <button onClick={() => setView('calendar')} className={`p-2 rounded-full ${view === 'calendar' ? 'bg-pink-100 text-pink-600' : 'text-gray-500 hover:bg-gray-100'}`}>
                      <CalendarIcon className="w-5 h-5" />
                    </button>
                    <button onClick={() => setView('settings')} className={`p-2 rounded-full ${view === 'settings' ? 'bg-pink-100 text-pink-600' : 'text-gray-500 hover:bg-gray-100'}`}>
                      <SettingsIcon className="w-5 h-5" />
                    </button>
                  </div>
                </div>
              </nav>

              <main className="max-w-4xl mx-auto p-3 sm:p-4 mt-2">
                {view === 'calendar' ? (
                  <div className="bg-white rounded-2xl shadow-sm p-4 sm:p-6">
                    <div className="flex justify-between items-center mb-6">
                      <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1))} className="p-2 hover:bg-pink-50 text-pink-500 rounded-full transition-colors">
                        <ChevronLeft className="w-6 h-6" />
                      </button>
                      <h2 className="text-lg sm:text-xl font-bold text-gray-800">
                        {currentDate.getFullYear()}年 {currentDate.getMonth() + 1}月
                      </h2>
                      <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1))} className="p-2 hover:bg-pink-50 text-pink-500 rounded-full transition-colors">
                        <ChevronRight className="w-6 h-6" />
                      </button>
                    </div>

                    <div className="grid grid-cols-7 gap-1 sm:gap-2 mb-2">
                      {['一', '二', '三', '四', '五', '六', '日'].map(day => (
                        <div key={day} className="text-center text-xs sm:text-sm font-medium text-gray-400 py-1">周{day}</div>
                      ))}
                    </div>

                    <div className="grid grid-cols-7 gap-1 sm:gap-2">
                      {renderCalendarDays()}
                    </div>

                    <div className="mt-8 pt-4 border-t border-gray-100 flex flex-col gap-3">
                      <div className="text-sm font-semibold text-gray-700">生理状态图例：</div>
                      <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 text-xs sm:text-sm text-gray-600">
                        <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-red-100 border border-red-300"></div>月经期</div>
                        <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-blue-50 border border-blue-200"></div>卵泡期</div>
                        <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-purple-100 border border-purple-300"></div>排卵期</div>
                        <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-fuchsia-200 border border-fuchsia-400"></div>排卵日</div>
                        <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-yellow-50 border border-yellow-200"></div>黄体期</div>
                      </div>

                      <div className="text-sm font-semibold text-gray-700 mt-2">界面标记图例：</div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs sm:text-sm text-gray-600">
                        <div className="flex items-center gap-1.5"><div className="w-4 h-4 rounded border border-gray-300 border-dashed"></div>虚线框代表仅有AI预测(未手动确认)</div>
                        <div className="flex items-center gap-1.5">
                          <div className="bg-gray-100 rounded-full p-0.5"><FileText className="w-2.5 h-2.5 text-gray-500" /></div>代表有文字备注
                        </div>
                        <div className="flex items-center gap-1.5 border border-gray-200 px-2 py-1 rounded bg-white w-fit shadow-sm">
                          <div className="flex overflow-hidden rounded text-[9px] font-medium border border-gray-100">
                             <span className="bg-gray-50 text-gray-500 px-1 border-r border-gray-100">预</span>
                             <span className="bg-pink-50 text-pink-600 px-1">实</span>
                          </div>
                          <span>修正后的左右分栏对比</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ) : (
                  <SettingsView settings={settings} setSettings={setSettings} setView={setView} clearSnapshots={clearSnapshots} setRecords={setRecords} />
                )}
              </main>

              {modalState.isOpen && (
                <EditModal
                  dateStr={modalState.dateStr}
                  dayData={getDayData(modalState.dateStr)}
                  onClose={() => setModalState({ isOpen: false, dateStr: null })}
                  onSave={handleSaveRecord}
                />
              )}
            </div>
          );
        }

        // --- 组件：周期设置视图 ---
        function SettingsView({ settings, setSettings, setView, clearSnapshots, setRecords }) {
          const [localSettings, setLocalSettings] = useState(settings);

          const handleResetAll = () => {
            if (!confirm('⚠️ 确定要重置所有数据吗？\n\n此操作将清除所有记录、设置和预测快照，且不可恢复！')) return;
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
              const key = localStorage.key(i);
              if (key && key.startsWith('period_tracker_')) keys.push(key);
            }
            keys.forEach(k => localStorage.removeItem(k));
            location.reload();
          };

          return (
            <div className="bg-white rounded-2xl shadow-sm p-6 max-w-md mx-auto">
              <h2 className="text-xl font-semibold mb-6 flex items-center gap-2 text-gray-800">
                <SettingsIcon className="w-5 h-5 text-pink-500" />
                基础周期设置
              </h2>
              <p className="text-sm text-gray-500 mb-6">这些设置将作为初始预测的参考依据。</p>

              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">月经周期长度 (天)</label>
                  <input type="number" value={localSettings.cycleLength} onChange={(e) => setLocalSettings({...localSettings, cycleLength: parseInt(e.target.value) || 28})} className="w-full rounded-lg bg-gray-50 border-transparent focus:bg-white focus:border-pink-500 focus:ring-2 focus:ring-pink-200 p-2.5 outline-none transition-all" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">经期持续天数 (天)</label>
                  <input type="number" value={localSettings.periodLength} onChange={(e) => setLocalSettings({...localSettings, periodLength: parseInt(e.target.value) || 5})} className="w-full rounded-lg bg-gray-50 border-transparent focus:bg-white focus:border-pink-500 focus:ring-2 focus:ring-pink-200 p-2.5 outline-none transition-all" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">黄体期长度 / 预测排卵日倒数 (天)</label>
                  <input type="number" value={localSettings.lutealLength} onChange={(e) => setLocalSettings({...localSettings, lutealLength: parseInt(e.target.value) || 14})} className="w-full rounded-lg bg-gray-50 border-transparent focus:bg-white focus:border-pink-500 focus:ring-2 focus:ring-pink-200 p-2.5 outline-none transition-all" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">系统初始基准日 (最近一次月经)</label>
                  <input type="date" value={localSettings.lastPeriodStart} onChange={(e) => setLocalSettings({...localSettings, lastPeriodStart: e.target.value})} className="w-full rounded-lg bg-gray-50 border-transparent focus:bg-white focus:border-pink-500 focus:ring-2 focus:ring-pink-200 p-2.5 outline-none transition-all" />
                </div>
                <button onClick={() => { clearSnapshots(); setSettings(localSettings); setView('calendar'); }} className="w-full mt-6 bg-pink-500 text-white py-3 px-4 rounded-xl font-medium hover:bg-pink-600 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                  <Check className="w-5 h-5" /> 保存并返回
                </button>
              </div>

              <div className="mt-10 pt-6 border-t border-gray-100">
                <h3 className="text-sm font-semibold text-gray-500 mb-3">危险操作</h3>
                <button onClick={handleResetAll} className="w-full bg-red-50 text-red-600 py-3 px-4 rounded-xl font-medium border-2 border-red-200 hover:bg-red-100 hover:border-red-300 active:scale-[0.98] transition-all">
                  🗑️ 重置所有数据
                </button>
                <p className="text-xs text-gray-400 mt-2 text-center">此操作将清除所有记录、设置和预测数据，不可恢复</p>
              </div>
            </div>
          );
        }

        // --- 组件：每日编辑弹窗 ---
        function EditModal({ dateStr, dayData, onClose, onSave }) {
          const [formData, setFormData] = useState({
            actualPhase: dayData.actualPhase || '',
            actualMood: dayData.actualMood || '',
            note: dayData.note || ''
          });

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">

                <div className="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                  <h3 className="text-lg font-bold text-gray-800 tracking-tight">{dateStr} 记录</h3>
                  <button onClick={onClose} className="p-1.5 text-gray-400 hover:bg-gray-200 rounded-full transition-colors"><XIcon className="w-5 h-5" /></button>
                </div>

                <div className="p-5 space-y-5 max-h-[75vh] overflow-y-auto">
                  <div className="bg-gradient-to-r from-pink-50 to-purple-50 rounded-xl p-4 border border-pink-100/50">
                    <div className="flex items-center gap-1.5 text-pink-600 font-semibold mb-3 text-sm">
                      <Sparkles className="w-4 h-4" /> AI 原始推测 (保存实际值后系统将产生对比)
                    </div>
                    <div className="space-y-2 text-sm">
                      <div className="flex justify-between items-center bg-white/60 px-3 py-2 rounded-lg">
                        <span className="text-gray-600 font-medium">生理期状态</span>
                        <span className={`px-2 py-0.5 rounded text-xs font-bold ${PHASE_STYLES[dayData.predictedPhase].bg} ${PHASE_STYLES[dayData.predictedPhase].text}`}>
                          {dayData.predictedPhase}
                        </span>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-2">
                    <label className="text-sm font-bold text-gray-700">修正生理期状态</label>
                    <div className="flex flex-wrap gap-2">
                      {Object.values(PHASES).map(phase => (
                        <button
                          key={phase}
                          onClick={() => setFormData({...formData, actualPhase: formData.actualPhase === phase ? '' : phase})}
                          className={`flex-1 min-w-[55px] py-2 px-1 text-[10px] sm:text-xs font-medium rounded-lg border-2 transition-all ${formData.actualPhase === phase ? 'bg-pink-50 border-pink-500 text-pink-700' : 'bg-white border-gray-100 text-gray-500 hover:border-pink-200'}`}
                        >
                          {phase}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-2">
                    <label className="text-sm font-bold text-gray-700">修正当日心情</label>
                    <div className="grid grid-cols-4 gap-2">
                      {Object.values(MOODS).map(mood => (
                        <button
                          key={mood.label}
                          onClick={() => setFormData({...formData, actualMood: formData.actualMood === mood.label ? '' : mood.label})}
                          className={`flex flex-col items-center p-2 rounded-xl border-2 transition-all ${formData.actualMood === mood.label ? 'bg-blue-50 border-blue-400' : 'bg-white border-gray-100 hover:bg-gray-50'}`}
                        >
                          <span className="text-2xl mb-1">{mood.emoji}</span>
                          <span className={`text-xs ${formData.actualMood === mood.label ? 'font-bold text-blue-700' : 'text-gray-500'}`}>{mood.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-2">
                    <label className="text-sm font-bold text-gray-700">生活备忘 / 日记</label>
                    <textarea
                      rows="3"
                      value={formData.note}
                      onChange={(e) => setFormData({...formData, note: e.target.value})}
                      placeholder="记录一下今天的感受和发生的事情吧..."
                      className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl p-3 text-sm focus:bg-white focus:ring-0 focus:border-pink-400 outline-none resize-none transition-colors"
                    />
                  </div>
                </div>

                <div className="px-5 py-4 bg-gray-50 border-t border-gray-100 flex justify-end gap-3">
                  <button onClick={onClose} className="px-5 py-2.5 text-sm font-bold text-gray-500 hover:text-gray-700 hover:bg-gray-200 rounded-xl transition-colors">取消</button>
                  <button onClick={() => onSave(dateStr, formData)} className="px-6 py-2.5 text-sm font-bold text-white bg-pink-500 rounded-xl hover:bg-pink-600 active:scale-95 shadow-sm transition-all flex items-center gap-2">
                    <Check className="w-4 h-4" /> 保存记录
                  </button>
                </div>
              </div>
            </div>
          );
        }

        // --- 渲染 ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
