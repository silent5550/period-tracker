    'bg-blue-50 text-blue-700 border-blue-200', 'bg-emerald-50 text-emerald-700 border-emerald-200',

  ];
  let hash = 0;
  if (name) {
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);

  );

function parseCSV(text) {
  let ret = [], currentRow = [], inQuote = false, value = '';
  for (let i = 0; i < text.length; i++) {
    let ch = text[i]; let nextCh = text[i+1];
    if (inQuote) {
      if (ch === '"') {
        if (nextCh === '"') { value += '"'; i++; } else { inQuote = false; }
      } else { value += ch; }
    } else {
      if (ch === '"') { inQuote = true; } 
      else if (ch === ',') { currentRow.push(value); value = ''; } 
      else if (ch === '\n' || ch === '\r') {
        currentRow.push(value); ret.push(currentRow); currentRow = []; value = '';
        if (ch === '\r' && nextCh === '\n') i++; 
      } else { value += ch; }
    }
  }
  if (value !== '' || currentRow.length > 0) { currentRow.push(value); ret.push(currentRow); }
  return ret;
}

function TrendChart({ data }) {
  const w = 700, h = 160;
  const maxCount = Math.max(...data.map(d => d.count)) * 1.2 || 1;
  const points = data.map((d, i) => `${(i / (data.length - 1 || 1)) * w},${h - (d.count / maxCount) * h}`).join(' ');
  const areaPoints = `0,${h} ${points} ${w},${h}`;
  return (
    <div className="w-full relative mt-8">
      <svg viewBox={`0 -20 ${w} ${h + 20}`} className="w-full h-48 overflow-visible">
        <defs><linearGradient id="chartGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor="#6366f1" stopOpacity="0.3" /><stop offset="100%" stopColor="#6366f1" stopOpacity="0" /></linearGradient></defs>
        <polygon points={areaPoints} fill="url(#chartGrad)" />
        <polyline points={points} fill="none" stroke="#6366f1" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
        {data.map((d, i) => (
          <g key={i} className="group relative cursor-pointer">
            <circle cx={(i / (data.length - 1 || 1)) * w} cy={h - (d.count / maxCount) * h} r="4" fill="#fff" stroke="#6366f1" strokeWidth="2.5" className="group-hover:r-[6px] transition-all duration-200" />
            <text x={(i / (data.length - 1 || 1)) * w} y={h - (d.count / maxCount) * h - 14} textAnchor="middle" className="text-[10px] fill-slate-700 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none font-bold">{d.count}</text>
          </g>
        ))}
      </svg>
      <div className="relative mt-2 text-xs text-slate-500 font-mono h-5">{data.filter(d => d.date).map((d, i) => {
        const origIdx = data.indexOf(d);
        const leftPct = (origIdx / (data.length - 1 || 1)) * 100;
        return <div key={i} style={{position: 'absolute', left: `${leftPct}%`, transform: 'translateX(-50%)'}} className="text-center">{d.date}</div>;
      })}</div>
    </div>
  );
}

function RegisterModal() {
  const { isRegisterModalOpen, setIsRegisterModalOpen, setApis, setProviders, setUploadResult, showToast, currentUser } = useContext(AppContext);
  const [tab, setTab] = useState('bulk');
  const fileInputRef = useRef(null);
  if (!isRegisterModalOpen) return null;
  const handleSingleSubmit = (e) => {
    e.preventDefault();
    const newApi = { id: `API_${Date.now()}`, name: e.target.name.value, providerId: e.target.providerId.value, url: e.target.url.value, publicDomain: e.target.publicDomain.value, method: e.target.method.value, version: e.target.version.value || 'v1.0', domainOwner: e.target.domainOwner.value, owner: currentUser, status: '规划中', desc: e.target.desc.value, docUrl: '' };
    setApis(prev => [...prev, newApi]); setIsRegisterModalOpen(false); showToast('单个接口注册成功！');
  };
  const handleFileUpload = (e) => {
    const file = e.target.files[0]; if (!file) return;
    if (!file.name.toLowerCase().endsWith('.csv')) { showToast('格式错误！请上传 CSV 格式文件。', 'error'); e.target.value = ''; return; }
    const reader = new FileReader();
    reader.onload = (evt) => {
      const text = evt.target.result;
      const rows = parseCSV(text).filter(row => row.join('').trim() !== '');
      if (rows.length <= 1) { showToast('文件为空或解析失败。', 'error'); e.target.value = ''; return; }
      let addedProviders = 0, addedApis = 0, addedConsumers = 0;
      setProviders(prev => { const map = new Map(); prev.forEach(p => map.set(p.name.split(' ')[0], p)); rows.slice(1).forEach(cols => { const pName = cols[0]?.trim(); if (pName && !map.has(pName)) { map.set(pName, { id: `p_${Date.now()}_${Math.random()}`, name: pName, owner: cols[7]?.trim() || '未知', color: 'bg-slate-100 text-slate-700' }); addedProviders++; } }); return Array.from(map.values()); });
      setApis(prev => { const map = new Map(); prev.forEach(a => map.set(a.url, a)); rows.slice(1).forEach(cols => { const url = cols[4]?.trim(); if (url && !map.has(url)) { map.set(url, { id: `API_${Date.now()}_${Math.random()}`, providerId: `p_algo`, name: cols[1]?.trim() || '未命名', publicDomain: cols[3]?.trim(), url, method: 'GET', version: cols[5]?.trim() || 'V1.0', domainOwner: cols[7]?.trim(), owner: cols[7]?.trim(), status: cols[8]?.trim() || '已上线', desc: cols[2]?.trim(), docUrl: '' }); addedApis++; } }); return Array.from(map.values()); });
      e.target.value = ''; setIsRegisterModalOpen(false); setUploadResult({ addedProviders, addedApis, addedConsumers });
    };
    reader.readAsText(file, 'gbk');
  };

function AppDependenciesModal() {
  const { isAppDepsModalOpen, setIsAppDepsModalOpen, depsConsumerId, consumers, relations, apis, providers, openDrawer, setIsAppDepsModalOpen: closeModal } = useContext(AppContext);
  const [callMonitorApi, setCallMonitorApi] = useState(null);
  if (!isAppDepsModalOpen) return null;
  const consumer = consumers.find(c => c.id === depsConsumerId);
  if (!consumer) return null;
  const relationApiIds = relations.filter(r => r.consumerId === consumer.id).map(r => r.apiId);
  const relatedApis = apis.filter(a => relationApiIds.includes(a.id));

  // Generate mock call counts for each API
  const getApiCallStats = (apiId) => {
    let hash = 0; const str = apiId + depsConsumerId;
    for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    const seed = Math.abs(hash);
    const d7 = (seed % 4901) + 100;
    const d30 = d7 * (3 + (seed % 5)) + (seed % 2000);
    const d90 = d30 * (2 + (seed % 4)) + (seed % 5000);
    const d180 = d90 * (1.5 + (seed % 3) * 0.5) + (seed % 8000);
    return { d7, d30: Math.floor(d30), d90: Math.floor(d90), d180: Math.floor(d180) };
  };

  const allStats = relatedApis.map(a => getApiCallStats(a.id));
  const totalStats = allStats.reduce((acc, s) => ({ d7: acc.d7 + s.d7, d30: acc.d30 + s.d30, d90: acc.d90 + s.d90, d180: acc.d180 + s.d180 }), { d7: 0, d30: 0, d90: 0, d180: 0 });

  if (callMonitorApi) {
    return (
      <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] flex items-center justify-center p-4">

              </div>
              <button type="button" onClick={() => setIsAppDepsModalOpen(false)} className="text-slate-400 hover:text-slate-600"><X size={20}/></button>
           </div>
           <div className="flex-1 overflow-auto bg-slate-50/50 p-6">
              <CallMonitorPanel consumer={consumer} apiName={callMonitorApi.name} onBack={() => setCallMonitorApi(null)} />
           </div>
        </div>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
      <div className="bg-white rounded-xl shadow-2xl w-full max-w-7xl max-h-[90vh] flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
         <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 flex-shrink-0">
            <div>
              <h2 className="text-lg font-bold text-slate-800 flex items-center"><Layers size={18} className="mr-2 text-emerald-600" /> 依赖的能力详情</h2>
              <p className="text-xs text-slate-500 mt-1">当前业务场景：<strong className="text-slate-700">{consumer.scenario}</strong></p>
            </div>
            <button type="button" onClick={() => setIsAppDepsModalOpen(false)} className="text-slate-400 hover:text-slate-600"><X size={20}/></button>
         </div>
         <div className="flex-1 overflow-auto bg-slate-50/50 p-6">
            <div className="grid grid-cols-4 gap-4 mb-6">
              <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col items-center justify-center"><div className="text-xs text-slate-500 mb-1">近7天调用次数</div><div className="text-xl font-bold text-indigo-600">{totalStats.d7.toLocaleString()}</div></div>
              <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col items-center justify-center"><div className="text-xs text-slate-500 mb-1">近30天调用次数</div><div className="text-xl font-bold text-blue-600">{totalStats.d30.toLocaleString()}</div></div>

              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead className="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                  <tr><th className="px-5 py-3.5 font-semibold text-slate-700">能力域</th><th className="px-5 py-3.5 font-semibold text-slate-700">能力点</th><th className="px-5 py-3.5 font-semibold text-slate-700">接口描述</th><th className="px-5 py-3.5 font-semibold text-slate-700">公网域名</th><th className="px-5 py-3.5 font-semibold text-slate-700">接口地址</th><th className="px-5 py-3.5 font-semibold text-slate-700">版本</th><th className="px-5 py-3.5 font-semibold text-slate-700">状态</th><th className="px-5 py-3.5 font-semibold text-slate-700">负责人</th><th className="px-5 py-3.5 font-semibold text-slate-700">近7天</th><th className="px-5 py-3.5 font-semibold text-slate-700">近30天</th><th className="px-5 py-3.5 font-semibold text-slate-700">近90天</th><th className="px-5 py-3.5 font-semibold text-slate-700">近180天</th><th className="px-5 py-3.5 font-semibold text-slate-700 text-center sticky right-0 bg-slate-50 border-l border-slate-200 z-20">操作</th></tr>

function StatsView() {

  return (
    <div className="h-full flex flex-col p-6 animate-in fade-in duration-300 bg-slate-50/50 overflow-auto">

        <div className="bg-white rounded-xl border border-slate-200 p-5 flex items-center shadow-sm"><div className="w-14 h-14 rounded-full bg-emerald-50 flex items-center justify-center mr-5"><LayoutGrid size={24} className="text-emerald-600"/></div><div><div className="text-sm font-medium text-slate-500 mb-1">接入业务场景</div><div className="text-3xl font-bold text-slate-800">{consumers.length}</div></div></div>
      </div>
      <h2 className="text-lg font-bold text-slate-800 mb-4">各能力域核心指标</h2>
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-6">
        {providers.map((provider, idx) => {
          const domainApis = apis.filter(a => a.providerId === provider.id);
          const apiIds = domainApis.map(a => a.id);
          const domainRelations = relations.filter(r => apiIds.includes(r.apiId));
          const uniqueConsumers = new Set(domainRelations.map(r => r.consumerId)).size;
          const seed = provider.id.charCodeAt(provider.id.length - 1);
          const callCount = domainRelations.length * 15200 + seed * 2305 + 8500;
          const trendData = Array.from({length: 14}).map((_, i) => 200 + Math.sin((i + seed) * 0.5) * 100 + (idx * 20));
          const maxVal = Math.max(...trendData) * 1.1;
          const points = trendData.map((d, i) => `${(i / (trendData.length - 1)) * w},${h - (d / maxVal) * h}`).join(' ');
          const areaPoints = `0,${h} ${points} ${w},${h}`;
          const strokeColor = '#3b82f6';
          return (
            <div key={provider.id} className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm flex flex-col cursor-pointer hover:shadow-md hover:border-blue-300 hover:-translate-y-0.5 transition-all duration-200" onClick={() => navigateToApiList(provider.id)} title={`点击查看「${provider.name}」域的接口清单`}>
              <div className="p-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center"><div className="font-bold text-slate-800 text-base flex items-center">{provider.name}<ArrowUpRight size={14} className="ml-1.5 text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity" /></div><OwnerBadge name={provider.owner} /></div>
              <div className="p-5 flex-1">
                <div className="grid grid-cols-3 gap-4 text-center mb-6">
                  <div><div className="text-xl font-bold text-slate-800">{domainApis.length}</div><div className="text-xs text-slate-500 mt-1">接口数量</div></div>
                  <div><div className="text-xl font-bold text-slate-800">{uniqueConsumers}</div><div className="text-xs text-slate-500 mt-1">接入场景</div></div>
                  <div><div className="text-xl font-bold text-slate-800">{callCount.toLocaleString()}</div><div className="text-xs text-slate-500 mt-1">累计调用</div></div>
                </div>
                <div className="mt-4 pt-4 border-t border-slate-100">
                  <div className="text-xs text-slate-400 mb-2 flex justify-between"><span>近14天调用趋势</span></div>
                  <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-12 overflow-visible">
                    <defs><linearGradient id={`grad-${provider.id}`} x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor={strokeColor} stopOpacity="0.2" /><stop offset="100%" stopColor={strokeColor} stopOpacity="0" /></linearGradient></defs>
                    <polygon points={areaPoints} fill={`url(#grad-${provider.id})`} />
                    <polyline points={points} fill="none" stroke={strokeColor} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function RequestManageView() {
  const { requests, setRequests, apis, consumers, relations, setRelations, currentUser, showToast } = useContext(AppContext);
  const [subTab, setSubTab] = useState('my_requests');
  const [currentPage, setCurrentPage] = useState(1);
  const pageSize = 10;
  useEffect(() => { setCurrentPage(1); }, [subTab, currentUser]);
  let filteredRequests = requests.filter(req => {
      if (subTab === 'my_requests') return req.applicant === currentUser;
      const api = apis.find(a => a.id === req.apiId);
      return api && (api.owner.includes(currentUser) || api.domainOwner.includes(currentUser));
  });
  const totalItems = filteredRequests.length;
  const safePage = Math.min(Math.max(currentPage, 1), Math.ceil(totalItems / pageSize) || 1);
  const paginatedReqs = filteredRequests.slice((safePage - 1) * pageSize, safePage * pageSize);
  const handleApprove = (req) => { setRequests(prev => prev.map(r => r.id === req.id ? { ...r, status: '已通过', approveTime: new Date().toISOString().split('T')[0] } : r)); setRelations(prev => [...prev, { apiId: req.apiId, consumerId: req.consumerId }]); showToast('审批通过成功，系统调用授权已自动生效！'); };
  const handleReject = (req) => { setRequests(prev => prev.map(r => r.id === req.id ? { ...r, status: '已驳回', approveTime: new Date().toISOString().split('T')[0] } : r)); showToast('已成功驳回该接口接入申请！', 'error'); };
  const handleCancel = (req) => { setRequests(prev => prev.map(r => r.id === req.id ? { ...r, status: '已撤销', approveTime: new Date().toISOString().split('T')[0] } : r)); showToast('您已成功撤销该申请。'); };
  return (
    <div className="h-full flex flex-col p-6 animate-in fade-in duration-300 bg-slate-50/50">
      <div className="mb-4"><h1 className="text-xl font-bold text-slate-800">申请与审批管理</h1><p className="text-sm text-slate-500 mt-1">跟踪并管理所有接入接口能力的申请单据与授权状态。</p></div>
      <div className="flex space-x-1 mb-4 border-b border-slate-200">
        <button type="button" onClick={() => setSubTab('my_requests')} className={`px-5 py-2.5 text-sm font-semibold border-b-2 transition-colors ${subTab === 'my_requests' ? 'border-indigo-600 text-indigo-700 bg-indigo-50/50' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-100'}`}>我的申请</button>
        <button type="button" onClick={() => setSubTab('todo')} className={`px-5 py-2.5 text-sm font-semibold border-b-2 transition-colors ${subTab === 'todo' ? 'border-indigo-600 text-indigo-700 bg-indigo-50/50' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-100'}`}>待我审批</button>
      </div>
      <div className="flex-1 bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex flex-col relative">
        <div className="flex-1 overflow-auto">
          <table className="w-full text-left text-sm whitespace-nowrap min-w-max">
            <thead className="bg-slate-50 border-b border-slate-200 sticky top-0 z-10"><tr><th className="px-5 py-3.5 font-semibold text-slate-700">申请单号</th><th className="px-5 py-3.5 font-semibold text-slate-700">申请订阅接口</th><th className="px-5 py-3.5 font-semibold text-slate-700">接口负责人</th><th className="px-5 py-3.5 font-semibold text-slate-700">申请业务场景</th><th className="px-5 py-3.5 font-semibold text-slate-700">申请系统域账号</th><th className="px-5 py-3.5 font-semibold text-slate-700">申请人</th><th className="px-5 py-3.5 font-semibold text-slate-700">申请时间</th><th className="px-5 py-3.5 font-semibold text-slate-700">审批时间</th><th className="px-5 py-3.5 font-semibold text-slate-700 text-center">状态</th><th className="px-5 py-3.5 font-semibold text-slate-700 text-center sticky right-0 bg-slate-50 border-l border-slate-200 z-20">操作</th></tr></thead>
            <tbody className="divide-y divide-slate-100">
              {paginatedReqs.map(req => {
                const api = apis.find(a => a.id === req.apiId) || { name: '未知', url: '未知' };
                const consumer = consumers.find(c => c.id === req.consumerId) || { domain: '未知', scenario: '未知', serviceName: '未知' };
                return (
                  <tr key={req.id} className="hover:bg-slate-50/80 transition-colors group">
                    <td className="px-5 py-4 font-mono text-xs text-slate-500">{req.id}</td>
                    <td className="px-5 py-4"><div className="font-medium text-slate-900">{api.name}</div><div className="text-xs text-slate-500 font-mono mt-0.5">{api.url}</div></td>
                    <td className="px-5 py-4"><OwnerBadge name={api.owner} /></td>
                    <td className="px-5 py-4"><div className="flex items-center text-slate-700"><Globe size={14} className="mr-1.5 text-slate-400" /> {consumer.domain} - {consumer.scenario}</div><div className="text-xs text-slate-500 font-mono mt-0.5">{consumer.serviceName}</div></td>
                    <td className="px-5 py-4"><span className="flex items-center text-indigo-600 font-mono text-xs bg-indigo-50 px-2 py-1 rounded w-max"><ShieldCheck size={12} className="mr-1"/>{req.systemAccount || '无'}</span></td>
                    <td className="px-5 py-4"><OwnerBadge name={req.applicant} /></td>
                    <td className="px-5 py-4 text-slate-500 text-xs font-mono">{req.createTime}</td>
                    <td className="px-5 py-4 text-slate-500 text-xs font-mono">{req.approveTime || '-'}</td>
                    <td className="px-5 py-4 text-center"><RequestStatusBadge status={req.status} /></td>
                    <td className="px-5 py-4 text-center sticky right-0 bg-white group-hover:bg-slate-50/80 border-l border-slate-100 transition-colors z-10">
                      <div className="flex justify-center items-center space-x-3">
                        {subTab === 'my_requests' && req.status === '待审批' && (<button type="button" onClick={() => handleCancel(req)} className="text-slate-600 font-medium hover:text-slate-800 hover:underline inline-flex items-center text-sm">撤销申请</button>)}
                        {subTab === 'todo' && req.status === '待审批' && (
                           <><button type="button" onClick={() => handleApprove(req)} className="text-emerald-600 font-medium hover:text-emerald-800 hover:underline inline-flex items-center text-sm"><Check size={14} className="mr-1"/> 通过</button><div className="w-px h-3 bg-slate-300"></div><button type="button" onClick={() => handleReject(req)} className="text-rose-600 font-medium hover:text-rose-800 hover:underline inline-flex items-center text-sm"><Ban size={14} className="mr-1"/> 驳回</button></>
                        )}
                        {req.status !== '待审批' && <span className="text-slate-400 text-xs">-</span>}
                      </div>
                    </td>
                  </tr>
                );
              })}
              {paginatedReqs.length === 0 && <tr><td colSpan="10" className="py-24 text-center text-slate-500"><ClipboardList size={48} className="mx-auto mb-4 text-slate-300" /><p>当前分类下暂无申请记录</p></td></tr>}
            </tbody>
          </table>
        </div>
        <Pagination total={totalItems} current={safePage} pageSize={pageSize} onChange={setCurrentPage} />
      </div>
    </div>
  );
}

              <button type="button" onClick={() => setActiveMenu('stats')} className={`h-full px-4 flex items-center border-b-2 font-medium text-sm transition-colors ${activeMenu === 'stats' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'}`}><PieChart size={16} className="mr-2" /> 统计概览</button>
              <button type="button" onClick={() => setActiveMenu('apis')} className={`h-full px-4 flex items-center border-b-2 font-medium text-sm transition-colors ${activeMenu === 'apis' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'}`}><Box size={16} className="mr-2" /> 接口能力清单</button>
              <button type="button" onClick={() => setActiveMenu('apps')} className={`h-full px-4 flex items-center border-b-2 font-medium text-sm transition-colors ${activeMenu === 'apps' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'}`}><LayoutGrid size={16} className="mr-2" /> 业务场景依赖</button>
              <button type="button" onClick={() => setActiveMenu('app_manage')} className={`h-full px-4 flex items-center border-b-2 font-medium text-sm transition-colors ${activeMenu === 'app_manage' ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'}`}><AppWindow size={16} className="mr-2" /> 业务场景管理</button>
              <button type="button" onClick={() => setActiveMenu('services')} className={`h-full px-4 flex items-center border-b-2 font-medium text-sm transition-colors ${activeMenu === 'services' ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'}`}><Server size={16} className="mr-2" /> 应用服务&域名管理</button>
              <button type="button" onClick={() => setActiveMenu('requests')} className={`h-full px-4 flex items-center border-b-2 font-medium text-sm transition-colors ${activeMenu === 'requests' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'}`}><ClipboardList size={16} className="mr-2" /> 申请管理</button>
            </nav>
          </div>
          <div className="flex items-center space-x-6">
            <div className="relative">
               <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" size={14} />
               <input type="text" placeholder="全局搜索..." className="w-48 pl-8 pr-4 py-1.5 bg-slate-100 border-transparent focus:bg-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-full text-xs transition-all outline-none" value={globalSearch} onChange={(e) => setGlobalSearch(e.target.value)} />
            </div>
            <div className="flex items-center space-x-3 border-l border-slate-200 pl-6">
              <span className="text-xs text-slate-400">当前测试账号:</span>
              <select className="bg-slate-100 text-slate-700 text-sm font-semibold rounded-md px-2 py-1 outline-none cursor-pointer border hover:border-blue-300" value={currentUser} onChange={(e) => setCurrentUser(e.target.value)}>
                <option value="孙业">孙业 (QTS / 算法)</option>
                <option value="肖海杰">肖海杰 (商家)</option>
                <option value="李托托">李托托 (大数据)</option>
                <option value="架构师_EA">架构师_EA (全部可见)</option>
              </select>
            </div>
          </div>
        </header>
        <main className="flex-1 overflow-hidden relative">
          {activeMenu === 'stats' && <StatsView />}
          {activeMenu === 'apis' && <ApiTableView />}
          {activeMenu === 'apps' && <AppTableView />}
          {activeMenu === 'app_manage' && <AppManageView />}
          {activeMenu === 'services' && <AppServiceDomainManageView />}
          {activeMenu === 'requests' && <RequestManageView />}
        </main>
        <Drawer isOpen={drawerOpen} onClose={() => setDrawerOpen(false)} title={drawerType === 'api-scenario' ? '接口影响面与调用监控' : drawerType === 'app-call-details' ? '业务场景调用详情' : drawerType === 'api-upstream' ? '全链路依赖下探' : ''} icon={drawerType === 'api-scenario' ? <Network /> : drawerType === 'api-upstream' ? <Waypoints /> : <Activity />}>
          {drawerType === 'api-upstream' ? <ApiUpstreamDrawerContent /> : null}
          {drawerType === 'api-scenario' ? <ApiScenarioDrawerContent /> : null}
          {drawerType === 'app-call-details' ? <AppCallDetailsDrawerContent /> : null}
        </Drawer>
        <GlobalToast />
        <ConfirmModal />
        <UploadResultModal />
        <AppDependenciesModal />
        <RegisterModal />
        <ApplyModal />
        <ConsumerFormModal />
        <AppServiceFormModal />
      </div>
    </AppContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
